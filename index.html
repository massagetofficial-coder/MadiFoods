<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madi Foods - Кулинария и пекарня в Кокшетау и Астане</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-emerald-50/20 text-neutral-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Bar -->
    <div class="bg-emerald-900 text-emerald-100 text-xs py-2 px-4 text-center font-medium">
        ✨ Свежая выпечка, полуфабрикаты, торты и горячие блюда с доставкой! Заказы принимаем ежедневно.
    </div>

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-emerald-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            
            <!-- Logo & Brand Name -->
            <div class="flex items-center gap-3 shrink-0">
                <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md border-2 border-yellow-400 overflow-hidden shrink-0">
                    <img src="мади.png" alt="Madi Foods Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-emerald-950 block leading-none">Madi Foods</span>
                    <span class="text-xs font-semibold text-emerald-700 tracking-wider uppercase">Аспаздық • Кулинария</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="hidden lg:flex items-center gap-6 font-medium text-sm text-neutral-600">
                <a href="#menu" class="hover:text-emerald-700 transition-colors">Меню</a>
                <a href="#about" class="hover:text-emerald-700 transition-colors">О нас</a>
                <a href="#contacts" class="hover:text-emerald-700 transition-colors">Контакты</a>
            </nav>

            <!-- Phone & Cart -->
            <div class="flex items-center gap-4 shrink-0">
                <a href="tel:+77074328272" class="hidden sm:flex items-center gap-2 text-emerald-950 font-bold hover:text-emerald-700">
                    <i class="fa-solid fa-phone text-emerald-700"></i>
                    <span>+7 707 432-82-72</span>
                </a>
                <button onclick="toggleCart()" class="relative bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2.5 rounded-full font-semibold shadow-md flex items-center gap-2 transition-all transform hover:scale-105">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span>Корзина</span>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-amber-500 text-neutral-950 text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-extrabold border-2 border-white">0</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative bg-emerald-950 text-white overflow-hidden py-20 lg:py-28">
        <div class="absolute inset-0 opacity-25 bg-cover bg-center" style="background-image: url('01_samsa_govyadina.png');"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-emerald-950 via-emerald-900/90 to-transparent"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="max-w-2xl">
                <span class="inline-block bg-yellow-500/20 text-yellow-300 border border-yellow-400/30 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4">
                    🥐 Домашняя кулинария и выпечка
                </span>
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tight mb-6 leading-tight">
                    Вкусно, как дома. Готовим с любовью!
                </h1>
                <p class="text-lg text-emerald-1
